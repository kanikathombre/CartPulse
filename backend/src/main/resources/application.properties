# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=cartpulse

# Database Configuration (MySQL)
# Uses environment variables DB_URL, DB_USERNAME, and DB_PASSWORD if provided, otherwise falls back to defaults for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_ecommerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# ddl-auto=update automatically creates or updates database tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
# Secret key must be injected via JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Data Seeder Configuration (Default: disabled in production)
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@cartpulse.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.user-email=${SEED_USER_EMAIL:user@cartpulse.com}
app.seed.user-password=${SEED_USER_PASSWORD:}

# Jackson JSON formatting
spring.jackson.serialization.indent_output=true
